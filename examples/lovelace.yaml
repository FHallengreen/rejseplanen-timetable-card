# Example Rejseplanen Lovelace card configurations
# Sensors: see "Example: one card per service" in README.md

# Single card
type: custom:rejseplanen-timetable-card
entity: sensor.rejseplanen_nearby_departures
max_items: 10

---

# One card per service at København H (as in the README screenshot)
# Line colors (S-tog A/B/C/E, metro M3/M4, DSB red, A-buses...) are applied automatically
type: grid
columns: 2
square: false
cards:
  - type: custom:rejseplanen-timetable-card
    entity: sensor.kobenhavn_h_s_tog
    max_items: 5
  - type: custom:rejseplanen-timetable-card
    entity: sensor.kobenhavn_h_metro
    max_items: 5
  - type: custom:rejseplanen-timetable-card
    entity: sensor.kobenhavn_h_regional_ic
    max_items: 5
  - type: custom:rejseplanen-timetable-card
    entity: sensor.hovedbanegarden_bus
    max_items: 5

---

# Without headings, stacked (e.g. for a narrow wall tablet)
type: vertical-stack
cards:
  - type: custom:rejseplanen-timetable-card
    entity: sensor.kobenhavn_h_s_tog
    show_name: false
    max_items: 4
  - type: custom:rejseplanen-timetable-card
    entity: sensor.kobenhavn_h_metro
    show_name: false
    max_items: 4
